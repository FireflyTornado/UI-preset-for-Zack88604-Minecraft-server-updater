quit.title=要停止本次更新嗎？
quit.message=停止後，將撤銷本次更新已完成的變更，並嘗試還原上一個可信版本。請保持此視窗開啟；只有檔案驗證通過後，Minecraft 才會啟動。
quit.keepUpdating=繼續更新
quit.skipUpdate=停止並嘗試啟動可信版本

help.title=解決方法
help.network.check=請檢查網路連線，然後重新執行更新。
help.network.access=如果使用了代理伺服器、VPN 或防火牆，請允許更新程式連線到更新伺服器。
help.authentication.warning=請勿略過此警告，也不要接受未經驗證的更新來源。
help.authentication.admin=請聯絡伺服器管理員，檢查已設定的 Ed25519 金鑰和清單簽章。
help.configuration.check=請檢查 mc-update.properties 中的更新伺服器位址和清單驗證金鑰。
help.configuration.admin=請向伺服器管理員確認正確的更新設定。
help.filesystem.close=請關閉 Minecraft，以及任何正在使用遊戲目錄中檔案的啟動器或程式。
help.filesystem.writableSpace=請確保遊戲目錄可寫入，且磁碟有足夠的可用空間。
help.filesystem.writable=請確認目前帳戶可以寫入遊戲目錄，然後重新執行更新。
help.disk.free=請清理遊戲目錄所在磁碟的空間。
help.disk.retry=確認磁碟空間充足後，請重新執行更新。
help.integrity.retry=請重新執行更新；剛才下載的檔案可能不完整。
help.integrity.cache=如果仍然失敗，請暫時停用快取代理伺服器或下載加速器。
help.generic.retry=請關閉 Minecraft 及其啟動器，然後重新執行更新。
help.generic.details=請在「詳細資訊」中查看失敗的檔案或伺服器訊息。
help.support=如果問題仍然存在，請在尋求協助時附上「詳細資訊」中的日誌。

