upstream.error.manifest.invalidKey=無法使用目前的更新驗證金鑰，請檢查金鑰設定和 Java 版本。
upstream.error.manifest.unsupportedClaims=更新清單的內容版本不受支援。
upstream.error.manifest.expired=更新清單已過期或時間資訊異常。
