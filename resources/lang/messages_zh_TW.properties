upstream.error.trust.rejected=未接受更新伺服器的身分金鑰，首次信任未建立。
upstream.error.trust.fingerprint=無法核對更新伺服器的安全金鑰。
upstream.error.trust.noPrompt=無法顯示更新伺服器的身分確認視窗。
upstream.error.trust.existingKey=偵測到現有的驗證金鑰，更新程式不會自動取代它。
upstream.error.trust.save=無法儲存更新伺服器的驗證資訊，請檢查遊戲目錄權限。
upstream.error.cache.noFileList=可信版本記錄中缺少完整的檔案清單。
upstream.error.cache.incomplete=無法快取不完整的已簽章清單。
