quit.title=要停止本次更新吗？
quit.message=停止后，将撤销本次更新已完成的更改，并尝试恢复上一个可信版本。请保持此窗口打开；只有文件验证通过后，Minecraft 才会启动。
quit.keepUpdating=继续更新
quit.skipUpdate=停止并尝试启动可信版本

help.title=故障诊断
help.network.check=请确认此设备可以访问更新服务器，并在网络稳定后重试。
help.network.access=如果使用了代理、VPN、防火墙或安全软件，请确认它们允许访问所有已配置的更新服务器地址。
help.download.server=请在“详细信息”中确认是否所有下载源均失败；可切换网络并重试。持续失败通常表示目标文件在更新源上缺失或不可访问。
help.authentication.warning=请勿绕过此警告，也不要接受身份未经验证的更新源。
help.authentication.admin=这通常表示清单签名、Ed25519 公钥或密钥 ID 不属于同一发布环境；请检查本机配置是否完整、来源一致且未经手动修改。
help.authentication.clock=请确认系统日期、时间和时区准确；签名清单只允许有限的时间偏差。
help.authentication.renew=如果系统时间无误，则清单可能已过期、有效期异常或签发时间超前；请等待更新源发布有效清单后重试。
help.key.check=请检查 mc-update.properties 中的 manifest-public-key 和 manifest-key-id；两者必须与当前更新环境一致。
help.key.admin=请从可信发布渠道恢复配套的 Ed25519 公钥和密钥 ID；不要从错误弹窗、日志或未知消息中复制替代值。
help.java.upgrade=请使用 Java 17 或更高版本重新启动更新程序；这同时满足 Ed25519 验证所需的 Java 15 最低版本。
help.java.key=升级 Java 后，请确认配置项是有效的 Base64/X.509 Ed25519 公钥。
help.configuration.check=请检查 mc-update.properties 中的更新服务器设置和清单必填项。
help.configuration.admin=请将本机配置与可信发布渠道提供的配置样例逐项对照，尤其检查服务器地址、公钥、密钥 ID 和字段拼写。
help.filesystem.close=请关闭 Minecraft、启动器以及任何可能正在使用游戏目录中文件的程序，然后重试。
help.filesystem.writableSpace=请确认游戏目录可写，并且目标磁盘有足够的可用空间。
help.filesystem.writable=请确认当前账户有权在游戏目录中创建和替换文件，然后重试。
help.disk.free=请释放游戏目录所在磁盘的空间。
help.disk.retry=确认磁盘空间充足后，请重新运行更新。
help.integrity.retry=请在网络稳定后重试；下载文件与签名清单中发布的校验值不一致。
help.integrity.cache=如果仍然不一致，请禁用缓存代理或下载加速器并切换网络；持续出现通常表示更新源文件与签名清单不一致。
help.manifest.pathRejected=服务器清单包含超出允许管理范围的文件路径；更新程序已拒绝该路径，以保护本地文件。
help.manifest.pathAdmin=这不是本机目录权限问题，本地重试也无法修复；请勿通过手动创建、移动文件或放宽权限来绕过路径检查。
help.manifest.format=服务器返回的签名清单格式错误或协议版本不兼容。请勿在本地手动修改清单。
help.manifest.regenerate=请先确认更新器版本与当前发布渠道匹配；若版本无误，只能等待更新源提供兼容且重新签名的清单。
help.trust.verifyFingerprint=请通过独立可信渠道核对界面显示的 Ed25519 SHA-256 指纹；无法确认时不要接受该密钥。
help.trust.retry=仅在指纹完全一致后，重新运行更新并接受该密钥。
help.trust.environment=更新程序无法在当前环境中完成服务器的首次身份验证。
help.trust.configuration=请确认当前为可交互的图形会话、游戏目录可写，并检查更新服务器返回的密钥描述是否包含算法、公钥和密钥 ID。
help.cache.unavailable=此设备尚未保存可用于安全启动 Minecraft 的已验证版本。
help.cache.rebuild=请恢复网络连接并成功完成一次正常更新，以建立新的可信版本记录。
help.cache.serverMismatch=保存的可信版本绑定到了另一组更新服务器配置。
help.cache.restoreServer=请恢复原来的服务器配置，或先使用当前配置成功完成一次正常更新，再使用恢复功能。
help.cache.invalid=保存的可信版本记录不完整、已损坏、体积异常或格式不受支持。
help.cache.noEdit=请勿手动编辑 .mc-update/signed-manifest-cache.properties；请通过一次正常更新安全地重建它。
help.cache.localMissing=可信版本记录有效，但所需的本地文件缺失或大小不符合记录。
help.cache.localMismatch=可信版本记录有效，但本地文件内容与记录的可信校验值不一致。
help.rollback.close=请关闭 Minecraft、启动器以及任何可能正在使用游戏目录中文件的程序。
help.rollback.permissions=请确认相关路径是普通文件，并且更新程序有权在该位置创建目录和替换文件。
help.generic.retry=请关闭 Minecraft 及其启动器，重新启动更新程序，并重试一次。
help.generic.details=请在“详细信息”中查看首个失败文件或服务器响应；它通常能指出需要处理的组件。
help.support=如果问题仍然存在，请向技术支持提供“详细信息”中的完整日志、错误发生时间及当前 Java 版本。

recovery.title=更新未完成
recovery.defaultError=未收到具体错误原因。
recovery.message={0}\n\n你可以退出，或尝试恢复上一个可信版本。恢复过程会验证签名清单和全部本地文件；所有检查通过后才会继续启动。
recovery.useTrusted=恢复并启动可信版本
recovery.exit=退出
