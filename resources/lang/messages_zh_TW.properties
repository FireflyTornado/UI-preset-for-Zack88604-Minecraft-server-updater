upstream.error.cache.unsupported=儲存的可信版本格式不受支援。
upstream.error.cache.wrongServer=儲存的可信版本不屬於目前設定的更新伺服器，無法使用。
upstream.error.cache.resourceMissing=可信版本所需的檔案遺失或大小不正確：{0}
