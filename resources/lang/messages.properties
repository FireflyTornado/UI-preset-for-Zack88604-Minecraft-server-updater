help.title=Troubleshooting
help.network.check=Confirm that this device can reach the update server, then retry after the connection is stable.
help.network.access=If a proxy, VPN, firewall, or security product is in use, verify that it permits access to every configured update-server address.
help.download.server=Check Details to see whether every download source failed, then try another network. Persistent failure usually means the target file is missing or inaccessible at the update source.
help.authentication.warning=Do not bypass this warning or accept an update source whose identity has not been verified.
help.authentication.admin=This usually means the manifest signature, Ed25519 public key, or key ID belongs to a different release environment; verify that the local configuration is complete, consistently sourced, and unmodified.
help.authentication.clock=Verify that the system date, time, and time zone are correct; signed manifests allow only limited clock skew.
help.authentication.renew=If the clock is correct, the manifest may be expired, have an invalid lifetime, or be issued in the future; retry after the update source publishes a valid manifest.
help.key.check=Check manifest-public-key and manifest-key-id in mc-update.properties; both must match the current update environment.
help.key.admin=Restore the matching Ed25519 public key and key ID from a trusted release channel; never copy replacement values from an error dialog, log, or unverified message.
help.java.upgrade=Restart the updater on Java 17 or later; this also satisfies the Java 15 minimum required for Ed25519 verification.
help.java.key=After upgrading Java, verify that the configured key is a valid Base64/X.509 Ed25519 public key.
help.configuration.check=Review the update-server settings and required manifest fields in mc-update.properties.
help.configuration.admin=Compare the local file with a trusted configuration example, especially the server addresses, public key, key ID, and field spelling.
help.filesystem.close=Close Minecraft, its launcher, and any program that may be using files in the game directory, then retry.
help.filesystem.writableSpace=Verify that the game directory is writable and that the target disk has sufficient free space.
help.filesystem.writable=Verify that the current account can create and replace files in the game directory, then retry.
help.disk.free=Free disk space on the drive containing the game directory.
help.disk.retry=After confirming sufficient free space, run the update again.
help.integrity.retry=Retry on a stable connection; the downloaded file did not match the checksum published in the signed manifest.
help.integrity.cache=If the mismatch persists, disable caching proxies or download accelerators and try another network; repeated mismatches usually mean the source file differs from the signed manifest.
help.manifest.pathRejected=The server manifest contains a path outside the permitted managed locations; the updater rejected it to protect local files.
help.manifest.pathAdmin=This is not a local directory-permission problem and cannot be fixed by retrying locally; do not create or move files, or relax permissions, to bypass the path check.
help.manifest.format=The server returned a malformed or incompatible signed manifest. Do not edit it locally.
help.manifest.regenerate=First confirm that the updater version matches the release channel. If it does, retry only after the source publishes a compatible, newly signed manifest.
help.trust.verifyFingerprint=Verify the displayed Ed25519 SHA-256 fingerprint through an independent trusted channel; do not accept the key if its identity cannot be confirmed.
help.trust.retry=Only after the fingerprint matches, run the update again and approve that exact key.
help.trust.environment=The updater could not complete first-use server identity verification in the current environment.
help.trust.configuration=Confirm that an interactive graphical session is available, the game directory is writable, and the returned key descriptor contains an algorithm, public key, and key ID.
help.cache.unavailable=This device has no previously verified version that can be used to start Minecraft safely.
help.cache.rebuild=Restore network access and complete one normal update to create a new trusted-version record.
help.cache.serverMismatch=The saved trusted version is bound to a different configured update-server list.
help.cache.restoreServer=Restore the original server configuration, or complete a normal update with the current configuration before using recovery.
help.cache.invalid=The saved trusted-version record is incomplete, damaged, oversized, or uses an unsupported format.
help.cache.noEdit=Do not edit .mc-update/signed-manifest-cache.properties manually; complete a normal update to replace it safely.
help.cache.localMissing=The trusted-version record is valid, but a required local file is missing or has an unexpected size.
help.cache.localMismatch=The trusted-version record is valid, but a local file's content does not match its trusted checksum.
help.rollback.close=Close Minecraft, its launcher, and any program that may be using files in the game directory.
help.rollback.permissions=Verify that the affected path is a regular file and that the updater can create directories and replace files there.
help.generic.retry=Close Minecraft and its launcher, restart the updater, and retry once.
help.generic.details=Review Details for the first failed file or server response; it usually identifies the component that requires attention.
help.support=If the problem persists, send technical support the complete Details log, the time of failure, and the current Java version.

