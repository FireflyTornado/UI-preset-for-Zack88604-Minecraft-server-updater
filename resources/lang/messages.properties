help.disk.retry=Run the update again after confirming the drive has room for the download.
help.integrity.retry=Try the update again; the downloaded file may have been incomplete.
help.integrity.cache=If it fails again, temporarily disable caching proxies or download accelerators.
help.generic.retry=Try the update again after closing Minecraft and its launcher.
help.generic.details=Check Details for the failed file or server message.
help.support=If the problem continues, copy the Details log when asking for support.

