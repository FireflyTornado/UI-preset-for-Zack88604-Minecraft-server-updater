help.title=解决办法
help.network.check=请检查网络连接，然后重新运行更新。
help.network.access=如果使用了代理、VPN 或防火墙，请允许更新器访问更新服务器。
help.authentication.warning=请勿绕过此警告，也不要接受未经验证的更新源。
help.authentication.admin=请联系服务器管理员，检查已配置的 Ed25519 密钥和清单签名。
help.configuration.check=请检查 mc-update.properties 中的更新服务器地址和清单验证密钥。
help.configuration.admin=请向服务器管理员确认正确的更新配置。
help.filesystem.close=请关闭 Minecraft，以及任何正在使用游戏目录中文件的启动器或程序。
help.filesystem.writableSpace=请确保游戏目录可写，且磁盘有足够的可用空间。
help.filesystem.writable=请确认当前账户可以写入游戏目录，然后重新运行更新。
help.disk.free=请清理游戏目录所在磁盘的空间。
help.disk.retry=确认磁盘空间充足后，请重新运行更新。
help.integrity.retry=请重新运行更新；刚才下载的文件可能不完整。
help.integrity.cache=如果仍然失败，请暂时禁用缓存代理或下载加速器。
help.generic.retry=请关闭 Minecraft 及其启动器，然后重新运行更新。
help.generic.details=请在“详细信息”中查看失败的文件或服务器消息。
help.support=如果问题仍然存在，请在寻求帮助时附上“详细信息”中的日志。

