quit.title=要停止本次更新嗎？
quit.message=停止後，將撤銷本次更新已完成的變更，並嘗試還原上一個可信版本。請保持此視窗開啟；只有檔案驗證通過後，Minecraft 才會啟動。
quit.keepUpdating=繼續更新
quit.skipUpdate=停止並嘗試啟動可信版本

help.title=故障診斷
help.network.check=請確認此裝置可以存取更新伺服器，並在網路穩定後重試。
help.network.access=如果使用了代理伺服器、VPN、防火牆或安全軟體，請確認它們允許存取所有已設定的更新伺服器位址。
help.download.server=請在「詳細資訊」中確認是否所有下載來源均失敗；可切換網路並重試。持續失敗通常表示目標檔案在更新來源上遺失或無法存取。
help.authentication.warning=請勿略過此警告，也不要接受身分未經驗證的更新來源。
help.authentication.admin=這通常表示清單簽章、Ed25519 公開金鑰或金鑰 ID 不屬於同一發布環境；請檢查本機設定是否完整、來源一致且未經手動修改。
help.authentication.clock=請確認系統日期、時間和時區正確；簽章清單只允許有限的時間偏差。
help.authentication.renew=如果系統時間無誤，則清單可能已過期、有效期異常或簽發時間超前；請等待更新來源發布有效清單後重試。
help.key.check=請檢查 mc-update.properties 中的 manifest-public-key 和 manifest-key-id；兩者必須與目前的更新環境一致。
help.key.admin=請從可信發布管道還原配套的 Ed25519 公開金鑰和金鑰 ID；不要從錯誤視窗、記錄或未知訊息中複製替代值。
help.java.upgrade=請使用 Java 17 或更新版本重新啟動更新程式；這同時符合 Ed25519 驗證所需的 Java 15 最低版本。
help.java.key=升級 Java 後，請確認設定項目是有效的 Base64/X.509 Ed25519 公開金鑰。
help.configuration.check=請檢查 mc-update.properties 中的更新伺服器設定和清單必填項目。
help.configuration.admin=請將本機設定與可信發布管道提供的設定範例逐項核對，尤其檢查伺服器位址、公開金鑰、金鑰 ID 和欄位拼寫。
help.filesystem.close=請關閉 Minecraft、啟動器以及任何可能正在使用遊戲目錄中檔案的程式，然後重試。
help.filesystem.writableSpace=請確認遊戲目錄可寫入，且目標磁碟有足夠的可用空間。
help.filesystem.writable=請確認目前帳戶有權在遊戲目錄中建立和取代檔案，然後重試。
help.disk.free=請釋放遊戲目錄所在磁碟的空間。
help.disk.retry=確認磁碟空間充足後，請重新執行更新。
help.integrity.retry=請在網路穩定後重試；下載檔案與簽章清單中發布的驗證值不一致。
help.integrity.cache=如果仍然不一致，請停用快取代理伺服器或下載加速器並切換網路；持續出現通常表示更新來源檔案與簽章清單不一致。
help.manifest.pathRejected=伺服器清單包含超出允許管理範圍的檔案路徑；更新程式已拒絕該路徑，以保護本機檔案。
help.manifest.pathAdmin=這不是本機目錄權限問題，本機重試也無法修復；請勿透過手動建立、移動檔案或放寬權限來略過路徑檢查。
help.manifest.format=伺服器傳回的簽章清單格式錯誤或通訊協定版本不相容。請勿在本機手動修改清單。
help.manifest.regenerate=請先確認更新程式版本與目前發布管道相符；若版本無誤，只能等待更新來源提供相容且重新簽署的清單。
help.trust.verifyFingerprint=請透過獨立可信管道核對介面顯示的 Ed25519 SHA-256 指紋；無法確認時不要接受該金鑰。
help.trust.retry=僅在指紋完全一致後，重新執行更新並接受該金鑰。
help.trust.environment=更新程式無法在目前環境中完成伺服器的首次身分驗證。
help.trust.configuration=請確認目前為可互動的圖形工作階段、遊戲目錄可寫入，並檢查更新伺服器傳回的金鑰描述是否包含演算法、公開金鑰和金鑰 ID。
help.cache.unavailable=此裝置尚未儲存可用於安全啟動 Minecraft 的已驗證版本。
help.cache.rebuild=請恢復網路連線並成功完成一次正常更新，以建立新的可信版本記錄。
help.cache.serverMismatch=儲存的可信版本綁定到另一組更新伺服器設定。
help.cache.restoreServer=請還原原本的伺服器設定，或先使用目前設定成功完成一次正常更新，再使用還原功能。
help.cache.invalid=儲存的可信版本記錄不完整、已損壞、大小異常或格式不受支援。
help.cache.noEdit=請勿手動編輯 .mc-update/signed-manifest-cache.properties；請透過一次正常更新安全地重建它。
help.cache.localMissing=可信版本記錄有效，但所需的本機檔案遺失或大小不符合記錄。
help.cache.localMismatch=可信版本記錄有效，但本機檔案內容與記錄的可信驗證值不一致。
help.rollback.close=請關閉 Minecraft、啟動器以及任何可能正在使用遊戲目錄中檔案的程式。
help.rollback.permissions=請確認相關路徑是一般檔案，且更新程式有權在該位置建立目錄和取代檔案。
help.generic.retry=請關閉 Minecraft 及其啟動器，重新啟動更新程式，並重試一次。
help.generic.details=請在「詳細資訊」中查看第一個失敗檔案或伺服器回應；它通常能指出需要處理的元件。
help.support=如果問題仍然存在，請向技術支援提供「詳細資訊」中的完整記錄、錯誤發生時間及目前的 Java 版本。

recovery.title=更新未完成
recovery.defaultError=未收到具體錯誤原因。
recovery.message={0}\n\n你可以離開，或嘗試還原上一個可信版本。還原過程會驗證簽章清單和全部本機檔案；所有檢查通過後才會繼續啟動。
recovery.useTrusted=還原並啟動可信版本
recovery.exit=離開
